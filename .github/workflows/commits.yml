name: Generate commit history

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  generate-commit-history:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate commit history file
        run: |
          {
            echo "# Git commit history"
            echo
            git log --date=raw 
          } > commit-history.txt

      - name: Commit generated history
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add commit-history.txt

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update commit history [skip ci]"
          git push
